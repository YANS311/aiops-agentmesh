skill_id: skill.pg16.lock_contention
fault_type: slow_sql_lock_contention
title: PostgreSQL Row Lock Contention & Blocking Query SOP
description: >
  Diagnoses unindexed bulk UPDATEs holding AccessExclusive/RowExclusive locks
  that block checkout transactions across replica and primary nodes.
default_severity: P1
default_service: order-ledger
diagnostic_tools:
  log_agent: query_slow_sql_logs
  db_agent: inspect_pg_locks
remediation:
  tool_name: cancel_blocking_backend_pid
  risk_level: HIGH
  requires_human_approval: true
  command_template: >
    SELECT pg_cancel_backend(pid) FROM pg_stat_activity
    WHERE pid IN (41892, 41907) AND wait_event_type = 'Lock';
  blast_radius: >
    Cancels 2 long-running batch settlement queries holding row locks on orders_ledger;
    caller batch job will retry cleanly at next checkpoint.
  rollback_command: >
    POST /internal/jobs/settlement/requeue --batch-id=latest
