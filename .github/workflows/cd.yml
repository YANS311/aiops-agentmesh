name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-images:
    name: Build & Push Docker Images (GHCR)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: PIP_INDEX_URL=https://pypi.org/simple
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aiops-agentmesh-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-images]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production compose manifest
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Create or update GitHub Release for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(echo "$OWNER_LOWER" | tr '[:upper:]' '[:lower:]')
          NOTES_FILE=$(mktemp)
          cat <<EOF > "$NOTES_FILE"
          ## AgentMesh AIOps Control Plane \`${TAG_NAME}\`

          ### Container Images (GHCR)
          - **Backend (API / Worker / Relay)**: \`ghcr.io/${OWNER_LC}/aiops-agentmesh-backend:${TAG_NAME#v}\`
          - **Frontend (Nginx + React SPA)**: \`ghcr.io/${OWNER_LC}/aiops-agentmesh-frontend:${TAG_NAME#v}\`

          ### Verification Summary
          - Full CI verified against real **PostgreSQL 16** + **Redis 7** + **Node 20** (31/31 pytest, Alembic \`0001 -> 0002\`, \`tsc -b && vite build\`).
          - Production 6-container decoupled deployment manifest attached: \`docker-compose.prod.yml\`.
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file "$NOTES_FILE"
            gh release upload "$TAG_NAME" docker-compose.prod.yml --clobber
          else
            gh release create "$TAG_NAME" docker-compose.prod.yml \
              --title "AgentMesh AIOps ${TAG_NAME}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes
          fi
