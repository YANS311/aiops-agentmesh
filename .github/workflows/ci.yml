name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend (PG16 + Redis 7 + Alembic + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops_ci_pwd
          POSTGRES_DB: aiops_mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops -d aiops_mesh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LLM_PROVIDER: mock
      AUTO_INIT_DB: "false"
      EMBEDDED_WORKERS: "false"
      ENABLE_FAULT_INJECTION: "true"
      TOOL_EXECUTION_MODE: mock
      A2A_PEER_URLS: ""
      DATABASE_URL: postgresql+asyncpg://aiops:aiops_ci_pwd@127.0.0.1:5432/aiops_mesh
      TEST_DATABASE_URL: postgresql+asyncpg://aiops:aiops_ci_pwd@127.0.0.1:5432/aiops_mesh_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Provision test database (aiops_mesh_test)
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main() -> None:
              conn = await asyncpg.connect(
                  user="aiops",
                  password="aiops_ci_pwd",
                  host="127.0.0.1",
                  port=5432,
                  database="postgres",
              )
              try:
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = 'aiops_mesh_test'"
                  )
                  if not exists:
                      await conn.execute('CREATE DATABASE "aiops_mesh_test"')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Verify Alembic migration on empty PostgreSQL 16 database
        run: alembic upgrade head

      - name: Run full pytest suite (real PG16 + Redis 7, LLM_PROVIDER=mock)
        run: pytest -v

  frontend-ci:
    name: Frontend Build & Prod Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build frontend (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

      - name: Validate production Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-strong-pg-password-991
          VIEWER_API_TOKEN: ci-viewer-strong-token-991
          SRE_APPROVER_API_TOKEN: ci-approver-strong-token-991
          ALERTMANAGER_WEBHOOK_SECRET: ci-webhook-strong-secret-991
        run: docker compose -f docker-compose.prod.yml config -q

  security-ci:
    name: Security Scan (Gitleaks Secret Detection)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
