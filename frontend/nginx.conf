server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE real-time trace stream: disable buffering/caching so events flush immediately
    location ~ ^/api/v1/incidents/[^/]+/events$ {
        proxy_pass http://backend-api:8016;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # REST API reverse proxy
    location /api/ {
        proxy_pass http://backend-api:8016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus metrics endpoint
    location = /metrics {
        proxy_pass http://backend-api:8016/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # React SPA static assets
    location / {
        try_files $uri $uri/ /index.html;
    }
}
