name: aiops-agentmesh-prod

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgresql+asyncpg://aiops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/aiops_mesh
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  LLM_API_KEY: ${LLM_API_KEY:-}
  AUTO_INIT_DB: "false"
  EMBEDDED_WORKERS: "false"
  ENABLE_FAULT_INJECTION: "false"
  TOOL_EXECUTION_MODE: ${TOOL_EXECUTION_MODE:-live}
  APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-900}
  RBAC_VIEWER_TOKEN: ${VIEWER_API_TOKEN:?VIEWER_API_TOKEN is required}
  RBAC_APPROVER_TOKEN: ${SRE_APPROVER_API_TOKEN:?SRE_APPROVER_API_TOKEN is required}
  ALERTMANAGER_WEBHOOK_SECRET: ${ALERTMANAGER_WEBHOOK_SECRET:?ALERTMANAGER_WEBHOOK_SECRET is required}
  SHUTDOWN_TIMEOUT_SECONDS: "10"
  A2A_PEER_URLS: ${A2A_PEER_URLS:-http://guidance-a2a-adapter:8020}
  A2A_AUTH_TOKEN: ${A2A_AUTH_TOKEN:-}
  A2A_TIMEOUT_SECONDS: "5.0"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: aiops_mesh
    volumes:
      - pg16_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops_mesh"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8016/api/v1/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.entrypoints.worker"]
    environment:
      <<: *backend-env
    depends_on:
      backend-api:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "app.entrypoints.worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.entrypoints.relay"]
    environment:
      <<: *backend-env
    depends_on:
      backend-api:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "app.entrypoints.relay", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend-api:
        condition: service_healthy

  guidance-a2a-adapter:
    build:
      context: ./adapters/guidance_a2a_adapter
      dockerfile: Dockerfile
    environment:
      ADAPTER_MODE: ${ADAPTER_MODE:-mock}
      GUIDANCE_NEO4J_URI: ${GUIDANCE_NEO4J_URI:-}
      GUIDANCE_RAG_METRICS_URL: ${GUIDANCE_RAG_METRICS_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg16_prod_data:
